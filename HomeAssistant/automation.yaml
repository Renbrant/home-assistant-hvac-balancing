alias: HVAC - Smart Bedroom Booster Control
description: >
  Controls Bed 1, Bed 2 and Bed 3 register booster fans using active PI-lite
  thermal balancing. Bedroom boosters continue balancing while the thermostat is
  in COOL or HEAT mode even when the compressor/furnace is idle. The original
  temperature-delta target speed provides proportional demand, while the
  adaptive controller can progressively increase fan speed when the bedroom
  imbalance does not improve sufficiently over approximately 20-minute
  intervals. When HVAC is actively heating or cooling, all boosters run at a
  minimum of Speed 1. Nest circulation is a second-stage assist and is requested
  only when any final PI target reaches Speed 8 or higher. Xtend Tuya feedback
  may remain stale, so commands are sent using the native fan entities.
triggers:
  - trigger: state
    entity_id:
      - sensor.bed_1_booster_pi_target_speed
      - sensor.bed_2_booster_pi_target_speed
      - sensor.bed_3_booster_pi_target_speed
  - trigger: state
    entity_id: climate.kitchen
    attribute: hvac_action
  - trigger: state
    entity_id: climate.kitchen
  - trigger: time_pattern
    hours: /1
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - variables:
      bed_1_target: |
        {% set target =
          states('sensor.bed_1_booster_pi_target_speed') | int(0)
        %} {% set action =
          state_attr('climate.kitchen', 'hvac_action')
        %} {% if action in ['cooling', 'heating'] %}
          {{ [target, 1] | max }}
        {% else %}
          {{ target }}
        {% endif %}
      bed_2_target: |
        {% set target =
          states('sensor.bed_2_booster_pi_target_speed') | int(0)
        %} {% set action =
          state_attr('climate.kitchen', 'hvac_action')
        %} {% if action in ['cooling', 'heating'] %}
          {{ [target, 1] | max }}
        {% else %}
          {{ target }}
        {% endif %}
      bed_3_target: |
        {% set target =
          states('sensor.bed_3_booster_pi_target_speed') | int(0)
        %} {% set action =
          state_attr('climate.kitchen', 'hvac_action')
        %} {% if action in ['cooling', 'heating'] %}
          {{ [target, 1] | max }}
        {% else %}
          {{ target }}
        {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ bed_1_target | int > 0 }}
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.bed_1_booster
            data:
              preset_mode: FAN
          - delay: '00:00:01'
          - action: fan.set_percentage
            target:
              entity_id: fan.bed_1_booster
            data:
              percentage: |
                {{ (bed_1_target | int) * 10 }}
          - delay: '00:00:01'
          - action: fan.turn_on
            target:
              entity_id: fan.bed_1_booster
    default:
      - action: fan.turn_off
        target:
          entity_id: fan.bed_1_booster
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ bed_2_target | int > 0 }}
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.bed_2_booster
            data:
              preset_mode: FAN
          - delay: '00:00:01'
          - action: fan.set_percentage
            target:
              entity_id: fan.bed_2_booster
            data:
              percentage: |
                {{ (bed_2_target | int) * 10 }}
          - delay: '00:00:01'
          - action: fan.turn_on
            target:
              entity_id: fan.bed_2_booster
    default:
      - action: fan.turn_off
        target:
          entity_id: fan.bed_2_booster
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ bed_3_target | int > 0 }}
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.bed_3_booster
            data:
              preset_mode: FAN
          - delay: '00:00:01'
          - action: fan.set_percentage
            target:
              entity_id: fan.bed_3_booster
            data:
              percentage: |
                {{ (bed_3_target | int) * 10 }}
          - delay: '00:00:01'
          - action: fan.turn_on
            target:
              entity_id: fan.bed_3_booster
    default:
      - action: fan.turn_off
        target:
          entity_id: fan.bed_3_booster
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{
                bed_1_target | int >= 8
                or
                bed_2_target | int >= 8
                or
                bed_3_target | int >= 8
              }}
        sequence:
          - action: nest.set_fan_timer
            target:
              entity_id: climate.kitchen
            data:
              duration:
                hours: 12
    default:
      - delay: '00:05:00'
      - condition: template
        value_template: |
          {{
            states('sensor.bed_1_booster_pi_target_speed') | int(0) < 8
            and
            states('sensor.bed_2_booster_pi_target_speed') | int(0) < 8
            and
            states('sensor.bed_3_booster_pi_target_speed') | int(0) < 8
          }}
      - action: climate.set_fan_mode
        target:
          entity_id: climate.kitchen
        data:
          fan_mode: 'off'
mode: restart
