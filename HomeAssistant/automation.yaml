alias: HVAC - Smart Bedroom Booster Control
description: >
  Controls Bed 1, Bed 2 and Bed 3 register booster fans based on calculated
  temperature-delta target speeds. When the HVAC is actively heating or cooling,
  all three boosters run at a minimum of Speed 1 to assist airflow. Higher
  calculated target speeds always take priority. Central Nest circulation is
  requested when any bedroom reaches Speed 4 or higher, corresponding to
  approximately 2.0°F of temperature imbalance. Xtend Tuya fan feedback may
  remain stale, so commands are sent using the native fan entities.
triggers:
  - trigger: state
    entity_id:
      - sensor.bed_1_booster_target_speed
      - sensor.bed_2_booster_target_speed
      - sensor.bed_3_booster_target_speed
  - trigger: state
    entity_id: climate.kitchen
    attribute: hvac_action
  - trigger: time_pattern
    hours: /1
  - trigger: homeassistant
    event: start
conditions: []
actions:
  - variables:
      bed_1_target: |
        {% set base =
          states('sensor.bed_1_booster_target_speed') | int(0)
        %} {% set action =
          state_attr('climate.kitchen', 'hvac_action')
        %}
        {% if action in ['cooling', 'heating'] %}
          {{ [base, 1] | max }}
        {% else %}
          {{ base }}
        {% endif %}
      bed_2_target: |
        {% set base =
          states('sensor.bed_2_booster_target_speed') | int(0)
        %} {% set action =
          state_attr('climate.kitchen', 'hvac_action')
        %}
        {% if action in ['cooling', 'heating'] %}
          {{ [base, 1] | max }}
        {% else %}
          {{ base }}
        {% endif %}
      bed_3_target: |
        {% set base =
          states('sensor.bed_3_booster_target_speed') | int(0)
        %} {% set action =
          state_attr('climate.kitchen', 'hvac_action')
        %}
        {% if action in ['cooling', 'heating'] %}
          {{ [base, 1] | max }}
        {% else %}
          {{ base }}
        {% endif %}
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ bed_1_target | int > 0 }}
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.bed_1_booster
            data:
              preset_mode: FAN
          - delay: '00:00:01'
          - action: fan.set_percentage
            target:
              entity_id: fan.bed_1_booster
            data:
              percentage: |
                {{ (bed_1_target | int) * 10 }}
          - delay: '00:00:01'
          - action: fan.turn_on
            target:
              entity_id: fan.bed_1_booster
    default:
      - action: fan.turn_off
        target:
          entity_id: fan.bed_1_booster
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ bed_2_target | int > 0 }}
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.bed_2_booster
            data:
              preset_mode: FAN
          - delay: '00:00:01'
          - action: fan.set_percentage
            target:
              entity_id: fan.bed_2_booster
            data:
              percentage: |
                {{ (bed_2_target | int) * 10 }}
          - delay: '00:00:01'
          - action: fan.turn_on
            target:
              entity_id: fan.bed_2_booster
    default:
      - action: fan.turn_off
        target:
          entity_id: fan.bed_2_booster
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{ bed_3_target | int > 0 }}
        sequence:
          - action: fan.set_preset_mode
            target:
              entity_id: fan.bed_3_booster
            data:
              preset_mode: FAN
          - delay: '00:00:01'
          - action: fan.set_percentage
            target:
              entity_id: fan.bed_3_booster
            data:
              percentage: |
                {{ (bed_3_target | int) * 10 }}
          - delay: '00:00:01'
          - action: fan.turn_on
            target:
              entity_id: fan.bed_3_booster
    default:
      - action: fan.turn_off
        target:
          entity_id: fan.bed_3_booster
  - choose:
      - conditions:
          - condition: template
            value_template: |
              {{
                bed_1_target | int >= 4
                or
                bed_2_target | int >= 4
                or
                bed_3_target | int >= 4
              }}
        sequence:
          - action: nest.set_fan_timer
            target:
              entity_id: climate.kitchen
            data:
              duration:
                hours: 12
    default:
      - delay: '00:05:00'
      - condition: template
        value_template: |
          {{
            states('sensor.bed_1_booster_target_speed') | int(0) < 4
            and
            states('sensor.bed_2_booster_target_speed') | int(0) < 4
            and
            states('sensor.bed_3_booster_target_speed') | int(0) < 4
          }}
      - action: climate.set_fan_mode
        target:
          entity_id: climate.kitchen
        data:
          fan_mode: 'off'
mode: restart
