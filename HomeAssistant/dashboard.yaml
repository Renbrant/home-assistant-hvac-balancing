type: sections
max_columns: 3
dense_section_placement: false
sections:
  - type: grid
    cards:
      - type: heading
        heading: HVAC Smart Booster - Live Status
        icon: mdi:home-thermometer
      - type: entities
        show_header_toggle: false
        entities:
          - entity: climate.kitchen
            icon: mdi:hvac
            name: AC
        grid_options:
          columns: 6
          rows: auto
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.kitchen_temp_temperature
            name: Kitchen
          - type: divider
          - entity: sensor.bed_1_temp_temperature
            name: Bed 1
          - entity: sensor.bed_1_temperature_delta
            name: Bed 1 ΔT
            icon: mdi:delta
          - entity: sensor.bed_1_booster_target_speed
            name: Bed 1 Target
            icon: mdi:fan-speed-1
          - entity: sensor.bed_1_booster_effective_percentage
            name: Bed 1 Effective
            icon: mdi:fan-chevron-up
          - entity: fan.bed_1_booster
            name: Bed 1 Booster
        grid_options:
          columns: 6
          rows: auto
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.kitchen_temp_temperature
            name: Kitchen
          - type: divider
          - entity: sensor.bed_2_temp_temperature
            name: Bed 2
          - entity: sensor.bed_2_temperature_delta
            name: Bed 2 ΔT
            icon: mdi:delta
          - entity: sensor.bed_2_booster_target_speed
            name: Bed 2 Target
            icon: mdi:fan-speed-1
          - entity: sensor.bed_2_booster_effective_percentage
            name: Bed 2 Effective
            icon: mdi:fan-chevron-up
          - entity: fan.bed_2_booster
            name: Bed 2 Booster
        grid_options:
          columns: 6
          rows: auto
      - type: entities
        show_header_toggle: false
        entities:
          - entity: sensor.kitchen_temp_temperature
            name: Kitchen
          - type: divider
          - entity: sensor.bed_3_temp_temperature
            name: Bed 3
          - entity: sensor.bed_3_temperature_delta
            name: Bed 3 ΔT
            icon: mdi:delta
          - entity: sensor.bed_3_booster_target_speed
            name: Bed 3 Target
            icon: mdi:fan-speed-1
          - entity: sensor.bed_3_booster_effective_percentage
            name: Bed 3 Effective
            icon: mdi:fan-chevron-up
          - entity: fan.bed_3_booster
            name: Bed 3 Booster
        grid_options:
          columns: 6
          rows: auto
    column_span: 3
  - type: grid
    cards:
      - type: heading
        heading: Temperature Balance
        icon: mdi:chart-line
      - type: custom:apexcharts-card
        graph_span: 48h
        header:
          show: true
          title: Kitchen vs Bedrooms
          show_states: true
          colorize_states: true
        now:
          show: true
          label: Now
        all_series_config:
          type: line
          curve: smooth
          stroke_width: 2
          extend_to: now
        yaxis:
          - id: temperature
            min: 65
            max: 85
            decimals: 0
            apex_config:
              tickAmount: 20
              title:
                text: °F
          - id: delta
            opposite: true
            min: -5
            max: 5
            decimals: 1
            apex_config:
              tickAmount: 10
              title:
                text: ΔT °F
        series:
          - entity: sensor.kitchen_temp_temperature
            name: Kitchen
            yaxis_id: temperature
            color: red
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.bed_1_temp_temperature
            name: Bed 1
            yaxis_id: temperature
            color: yellow
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.bed_2_temp_temperature
            name: Bed 2
            yaxis_id: temperature
            color: orange
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.bed_3_temp_temperature
            name: Bed 3
            yaxis_id: temperature
            color: lime
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.bed_1_temperature_delta
            name: Bed 1 ΔT
            yaxis_id: delta
            color: yellow
            stroke_width: 1
            opacity: 0.4
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.bed_2_temperature_delta
            name: Bed 2 ΔT
            yaxis_id: delta
            color: orange
            stroke_width: 1
            opacity: 0.4
            group_by:
              func: avg
              duration: 10min
          - entity: sensor.bed_3_temperature_delta
            name: Bed 3 ΔT
            yaxis_id: delta
            color: lime
            stroke_width: 1
            opacity: 0.4
            group_by:
              func: avg
              duration: 10min
        apex_config:
          chart:
            height: 380px
          legend:
            show: true
          markers:
            size: 0
          stroke:
            lineCap: round
        grid_options:
          columns: 20
          rows: auto
    column_span: 3
  - type: grid
    columns: 1
    square: false
    cards:
      - type: heading
        heading: Booster Controller
        icon: mdi:fan-auto
      - type: custom:apexcharts-card
        graph_span: 24h
        stacked: false
        header:
          show: true
          title: Booster Speed vs Temperature Delta
          show_states: true
          colorize_states: true
        now:
          show: true
          label: Now
        yaxis:
          - id: speed
            min: 0
            max: 10
            decimals: 0
            apex_config:
              tickAmount: 10
              title:
                text: Speed
          - id: delta
            opposite: true
            min: -5
            max: 5
            decimals: 1
            apex_config:
              tickAmount: 10
              title:
                text: ΔT °F
        series:
          - entity: sensor.bed_1_booster_target_speed
            name: Bed 1 Speed
            yaxis_id: speed
            color: yellow
            type: line
            curve: stepline
            stroke_width: 1
            stroke_dash: 0
            opacity: 1
            float_precision: 0
            extend_to: now
            show:
              in_header: raw
            transform: |
              const value = Number(x);
              if (!Number.isFinite(value)) return null;

              // Keep Speed 0 inside the graph.
              return value > 0 ? value - 0.18 : value;
          - entity: sensor.bed_1_temperature_delta
            name: Bed 1 ΔT
            yaxis_id: delta
            color: yellow
            type: line
            curve: smooth
            stroke_width: 1
            opacity: 0.4
            extend_to: now
            show:
              in_header: raw
            transform: |
              const value = Number(x);
              return Number.isFinite(value) ? value : null;
          - entity: sensor.bed_2_booster_target_speed
            name: Bed 2 Speed
            yaxis_id: speed
            color: orange
            type: line
            curve: stepline
            stroke_width: 1
            stroke_dash: 0
            opacity: 1
            float_precision: 0
            extend_to: now
            show:
              in_header: raw
            transform: |
              const value = Number(x);
              return Number.isFinite(value) ? value : null;
          - entity: sensor.bed_2_temperature_delta
            name: Bed 2 ΔT
            yaxis_id: delta
            color: orange
            type: line
            curve: smooth
            stroke_width: 1
            opacity: 0.4
            extend_to: now
            show:
              in_header: raw
            transform: |
              const value = Number(x);
              return Number.isFinite(value) ? value : null;
          - entity: sensor.bed_3_booster_target_speed
            name: Bed 3 Speed
            yaxis_id: speed
            color: lime
            type: line
            curve: stepline
            stroke_width: 1
            stroke_dash: 0
            opacity: 1
            float_precision: 0
            extend_to: now
            show:
              in_header: raw
            transform: |
              const value = Number(x);
              if (!Number.isFinite(value)) return null;

              // Keep Speed 10 inside the graph.
              return value < 10 ? value + 0.18 : value;
          - entity: sensor.bed_3_temperature_delta
            name: Bed 3 ΔT
            yaxis_id: delta
            color: lime
            type: line
            curve: smooth
            stroke_width: 1
            opacity: 0.4
            extend_to: now
            show:
              in_header: raw
            transform: |
              const value = Number(x);
              return Number.isFinite(value) ? value : null;
        apex_config:
          chart:
            height: 380px
          legend:
            show: true
          markers:
            size: 0
          stroke:
            lineCap: round
          grid:
            show: true
          annotations:
            yaxis:
              - 'true': 0
                yAxisIndex: 1
                borderColor: white
                strokeDashArray: 0
                label:
                  show: false
        grid_options:
          columns: full
          rows: 10
    column_span: 3
  - type: grid
    cards:
      - type: heading
        heading: Airflow Activity
        icon: mdi:air-filter
      - type: custom:apexcharts-card
        graph_span: 24h
        header:
          show: true
          title: Boosters and Nest Blower
          show_states: false
        now:
          show: true
          label: Now
        yaxis:
          - min: 0
            max: 7
            decimals: 0
            apex_config:
              tickAmount: 7
              labels:
                formatter: |
                  EVAL:function(value) {
                    const labels = {
                      0: "Bed 1 OFF",
                      1: "Bed 1 ON",
                      2: "Bed 2 OFF",
                      3: "Bed 2 ON",
                      4: "Bed 3 OFF",
                      5: "Bed 3 ON",
                      6: "Nest OFF",
                      7: "Nest ON"
                    };
                    return labels[Math.round(value)] || "";
                  }
        all_series_config:
          type: line
          curve: stepline
          stroke_width: 3
          extend_to: now
        series:
          - entity: fan.bed_1_booster
            name: Bed 1 Booster
            color: yellow
            transform: |
              return x === "on" ? 1 : 0;
          - entity: fan.bed_2_booster
            name: Bed 2 Booster
            color: orange
            transform: |
              return x === "on" ? 3 : 2;
          - entity: fan.bed_3_booster
            name: Bed 3 Booster
            color: lime
            transform: |
              return x === "on" ? 5 : 4;
          - entity: climate.kitchen
            attribute: fan_mode
            name: Nest Blower
            color: cyan
            transform: |
              return x === "on" ? 7 : 6;
        apex_config:
          chart:
            height: 320px
          legend:
            show: true
          markers:
            size: 0
        grid_options:
          columns: full
          rows: auto
  - type: grid
