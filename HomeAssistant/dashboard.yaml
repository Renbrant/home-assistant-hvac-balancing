type: sections
max_columns: 3
dense_section_placement: false
sections:
  - type: grid
    cards:
      - type: heading
        heading: HVAC Smart Booster - Live Status
        icon: mdi:home-thermometer
      - type: entities
        show_header_toggle: false
        grid_options:
          columns: 10
          rows: auto
        entities:
          - entity: climate.kitchen
            name: AC
            icon: mdi:hvac
          - type: divider
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_temp_temperature
            name: Temperature
            icon: mdi:thermometer
            show_state_first: true
            state_header: Bed 1
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_temp_temperature
                name: Bed 2
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_temp_temperature
                name: Bed 3
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_temperature_delta
            name: Delta
            icon: mdi:delta
            show_state_first: true
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_temperature_delta
                name: false
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_temperature_delta
                name: false
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_booster_target_speed
            name: Base P
            icon: mdi:fan-speed-1
            show_state_first: true
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_booster_target_speed
                name: false
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_booster_target_speed
                name: false
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_booster_adaptive_boost
            name: Adaptive I
            icon: mdi:fan-plus
            show_state_first: true
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_booster_adaptive_boost
                name: false
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_booster_adaptive_boost
                name: false
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_booster_adaptive_boost
            attribute: reference_error
            name: Ref 20m
            icon: mdi:history
            show_state_first: true
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_booster_adaptive_boost
                attribute: reference_error
                name: false
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_booster_adaptive_boost
                attribute: reference_error
                name: false
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_booster_adaptive_boost
            attribute: last_evaluation
            name: Last Eval
            icon: mdi:clock-outline
            show_state_first: true
            format: time
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_booster_adaptive_boost
                attribute: last_evaluation
                name: false
                format: time
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_booster_adaptive_boost
                attribute: last_evaluation
                name: false
                format: time
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_booster_pi_target_speed
            name: PI Target
            icon: mdi:fan-auto
            show_state_first: true
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_booster_pi_target_speed
                name: false
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_booster_pi_target_speed
                name: false
                styles:
                  width: 55px
                  text-align: center
          - type: custom:multiple-entity-row
            entity: sensor.bed_1_booster_effective_percentage
            name: Fan
            icon: mdi:fan
            show_state_first: true
            styles:
              width: 55px
              text-align: center
            entities:
              - entity: sensor.bed_2_booster_effective_percentage
                name: false
                styles:
                  width: 55px
                  text-align: center
              - entity: sensor.bed_3_booster_effective_percentage
                name: false
                styles:
                  width: 55px
                  text-align: center
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              --ha-card-background: transparent !important;
              box-shadow: none !important;
              border: none !important;
            }
      - type: custom:plotly-graph
        hours_to_show: 80h
        refresh_interval: auto
        autorange_after_scroll: true
        grid_options:
          columns: 25
          rows: auto
        config:
          displayModeBar: false
          scrollZoom: false
          responsive: true
        layout:
          autosize: true
          height: 820
          paper_bgcolor: rgba(0,0,0,0)
          plot_bgcolor: rgba(0,0,0,0)
          hovermode: x unified
          font:
            size: 13
          margin:
            l: 75
            r: 190
            t: 20
            b: 60
          xaxis:
            type: date
            autorange: true
            fixedrange: true
            showgrid: true
            zeroline: false
            nticks: 14
            ticks: outside
            automargin: true
            tickfont:
              size: 12
          yaxis:
            domain:
              - 0
              - 0.205
            anchor: x
            side: left
            range:
              - 0
              - 100
            fixedrange: true
            automargin: true
            visible: true
            showticklabels: true
            ticks: outside
            tickvals:
              - 0
              - 20
              - 40
              - 60
              - 80
              - 100
            ticksuffix: '%'
            tickfont:
              size: 12
            title:
              text: Fan (%)
              standoff: 8
              font:
                size: 14
            showgrid: true
            zeroline: true
            tickformat: .0f
          yaxis2:
            domain:
              - 0.265
              - 0.47
            anchor: x
            side: left
            overlaying: false
            autorange: true
            fixedrange: true
            automargin: true
            visible: true
            showticklabels: true
            ticks: outside
            nticks: 5
            tickfont:
              size: 12
            title:
              text: ΔT
              standoff: 8
              font:
                size: 14
            showgrid: true
            zeroline: true
            tickformat: .0f
          yaxis3:
            domain:
              - 0.53
              - 0.735
            anchor: x
            side: left
            overlaying: false
            autorange: true
            fixedrange: true
            automargin: true
            visible: true
            showticklabels: true
            ticks: outside
            nticks: 5
            tickfont:
              size: 12
            title:
              text: °F
              standoff: 8
              font:
                size: 14
            showgrid: true
            zeroline: false
            tickformat: .0f
          yaxis4:
            domain:
              - 0.795
              - 1
            anchor: x
            side: left
            overlaying: false
            autorange: true
            rangemode: tozero
            fixedrange: true
            automargin: true
            visible: true
            showticklabels: true
            ticks: outside
            nticks: 5
            tickfont:
              size: 12
            title:
              text: W
              standoff: 8
              font:
                size: 14
            showgrid: true
            zeroline: true
            tickformat: ~s
          legend:
            title:
              text: HVAC Power
              font:
                size: 14
            orientation: v
            x: 1.055
            'y': 1
            xanchor: left
            yanchor: top
            font:
              size: 12
            tracegroupgap: 5
          legend2:
            title:
              text: Temperatures
              font:
                size: 14
            orientation: v
            x: 1.055
            'y': 0.735
            xanchor: left
            yanchor: top
            font:
              size: 12
            tracegroupgap: 5
          legend3:
            title:
              text: Delta temp
              font:
                size: 14
            orientation: v
            x: 1.055
            'y': 0.47
            xanchor: left
            yanchor: top
            font:
              size: 12
            tracegroupgap: 5
          legend4:
            title:
              text: Fan speed
              font:
                size: 14
            orientation: v
            x: 1.055
            'y': 0.205
            xanchor: left
            yanchor: top
            font:
              size: 12
            tracegroupgap: 5
        entities:
          - entity: sensor.ac_power_total
            name: AC
            yaxis: y4
            legend: legend
            mode: lines
            line:
              width: 1.5
              color: '#42A5F5'
              shape: hv
            fill: tozeroy
            fillcolor: rgba(66,165,245,0.18)
          - entity: sensor.furnace_power_total
            name: Airflow
            yaxis: y4
            legend: legend
            mode: lines
            line:
              width: 2
              color: '#B0BEC5'
              shape: hv
            fill: tozeroy
            fillcolor: rgba(176,190,197,0.10)
          - entity: sensor.kitchen_temperature
            name: AC Temp
            yaxis: y3
            legend: legend2
            mode: lines
            line:
              width: 1.7
              color: '#4285F4'
              shape: linear
          - entity: climate.kitchen
            attribute: temperature
            name: Target
            yaxis: y3
            legend: legend2
            mode: lines
            line:
              width: 1
              color: grey
              shape: hv
              dash: dot
          - entity: sensor.kitchen_temp_temperature
            name: Kitchen
            yaxis: y3
            legend: legend2
            mode: lines
            line:
              width: 1.7
              color: red
              shape: linear
          - entity: sensor.bed_1_temp_temperature
            name: Bed 1
            yaxis: y3
            legend: legend2
            mode: lines
            line:
              width: 1.7
              color: yellow
              shape: linear
          - entity: sensor.bed_2_temp_temperature
            name: Bed 2
            yaxis: y3
            legend: legend2
            mode: lines
            line:
              width: 1.7
              color: orange
              shape: linear
          - entity: sensor.bed_3_temp_temperature
            name: Bed 3
            yaxis: y3
            legend: legend2
            mode: lines
            line:
              width: 1.7
              color: green
              shape: linear
          - entity: sensor.bed_1_temperature_delta
            name: Bed 1
            yaxis: y2
            legend: legend3
            mode: lines
            line:
              width: 1.7
              color: yellow
              shape: linear
          - entity: sensor.bed_2_temperature_delta
            name: Bed 2
            yaxis: y2
            legend: legend3
            mode: lines
            line:
              width: 1.7
              color: orange
              shape: linear
          - entity: sensor.bed_3_temperature_delta
            name: Bed 3
            yaxis: y2
            legend: legend3
            mode: lines
            line:
              width: 1.7
              color: green
              shape: linear
          - entity: sensor.bed_1_booster_effective_percentage
            name: Bed 1
            yaxis: y1
            legend: legend4
            mode: lines
            line:
              width: 1
              color: yellow
              shape: hv
          - entity: sensor.bed_2_booster_effective_percentage
            name: Bed 2
            yaxis: y1
            legend: legend4
            mode: lines
            line:
              width: 1
              color: orange
              shape: hv
          - entity: sensor.bed_3_booster_effective_percentage
            name: Bed 3
            yaxis: y1
            legend: legend4
            mode: lines
            line:
              width: 1
              color: green
              shape: hv
          - entity: sensor.bed_1_booster_adaptive_boost
            name: B1 Adap
            yaxis: y1
            legend: legend4
            mode: lines
            line:
              width: 1
              color: yellow
              shape: hv
              dash: dot
            filters:
              - map_y_numbers: y * 10
          - entity: sensor.bed_2_booster_adaptive_boost
            name: B2 Adap
            yaxis: y1
            legend: legend4
            mode: lines
            line:
              width: 1
              color: orange
              shape: hv
              dash: dot
            filters:
              - map_y_numbers: y * 10
          - entity: sensor.bed_3_booster_adaptive_boost
            name: B3 Adap
            yaxis: y1
            legend: legend4
            mode: lines
            line:
              width: 1
              color: green
              shape: hv
              dash: dot
            filters:
              - map_y_numbers: y * 10
        card_mod:
          style: |
            ha-card {
              height: 830px !important;
              overflow: hidden !important;
            }
    column_span: 3
cards: []
title: HVAC Boost v1.3 PI-Lite
background:
  opacity: 33
  alignment: center
  size: cover
  repeat: repeat
  attachment: fixed
  image:
    media_content_id: >-
      media-source://media_source/local/Dark-Black-Background-Wallpaper-HD-40752.jpg
    media_content_type: image/jpeg
    metadata:
      title: Dark-Black-Background-Wallpaper-HD-40752.jpg
      thumbnail: null
      media_class: image
      children_media_class: null
      navigateIds:
        - {}
        - media_content_type: app
          media_content_id: media-source://media_source
