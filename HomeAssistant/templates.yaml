            {# 0.5°F or more improvement: remove one adaptive step. #}
            {% elif improvement >= 0.5 %}

              {{ [current - 1, 0] | max }}

            {# 0.2-0.5°F improvement: hold. #}
            {% else %}

              {{ current }}

            {% endif %}

          {% endif %}

        {% endif %}

      attributes:

        base_speed: >
          {{ states('sensor.bed_2_booster_target_speed') | int(0) }}

        control_direction: >
