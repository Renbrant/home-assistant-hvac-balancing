        {% else %}

          {# -------------------------------------------------- #}
          {# Calculate directional temperature error.           #}
          {# -------------------------------------------------- #}

          {% if mode == 'cool' %}
            {% set error = room - kitchen %}
          {% else %}
            {% set error = 0 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Increasing-demand thresholds.                     #}
          {# -------------------------------------------------- #}

          {% if error < 1.5 %}
            {% set rising = 0 %}

          {% elif error < 2.0 %}
            {% set rising = 2 %}

          {% elif error < 2.5 %}
            {% set rising = 4 %}

          {% elif error < 3.0 %}
            {% set rising = 6 %}

          {% elif error < 3.5 %}
            {% set rising = 8 %}

          {% else %}
            {% set rising = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Decreasing-demand thresholds with 0.2°F hysteresis.#}
          {# -------------------------------------------------- #}

          {% if error <= 1.3 %}
            {% set falling = 0 %}

          {% elif error <= 1.8 %}
            {% set falling = 2 %}

          {% elif error <= 2.3 %}
            {% set falling = 4 %}

          {% elif error <= 2.8 %}
            {% set falling = 6 %}

          {% elif error <= 3.3 %}
            {% set falling = 8 %}

          {% else %}
            {% set falling = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Apply hysteresis.                                  #}
          {# -------------------------------------------------- #}

          {% if rising > previous %}

            {{ rising }}

          {% elif rising < previous %}

            {{ falling }}

          {% else %}

            {{ previous }}

          {% endif %}

        {% endif %}

    # ==========================================================
    # BED 3 BOOSTER TARGET SPEED
    #
    # Same curve and hysteresis used for Bed 1 and Bed 2.
    # ==========================================================

    - name: "Bed 3 Booster Target Speed"
      unique_id: bed_3_booster_target_speed
      state: >
        {% set room = states('sensor.bed_3_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}
        {% set mode = states('climate.kitchen') %}
        {% set previous = this.state | int(0) %}

        {% if room is none or kitchen is none %}

          {{ none }}

        {% else %}

          {# -------------------------------------------------- #}
          {# Calculate directional temperature error.           #}
          {# -------------------------------------------------- #}

          {% if mode == 'cool' %}
            {% set error = room - kitchen %}
          {% else %}
            {% set error = 0 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Increasing-demand thresholds.                     #}
          {# -------------------------------------------------- #}

          {% if error < 1.5 %}
            {% set rising = 0 %}

          {% elif error < 2.0 %}
            {% set rising = 2 %}

          {% elif error < 2.5 %}
            {% set rising = 4 %}

          {% elif error < 3.0 %}
            {% set rising = 6 %}

          {% elif error < 3.5 %}
            {% set rising = 8 %}

          {% else %}
            {% set rising = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Decreasing-demand thresholds with 0.2°F hysteresis.#}
          {# -------------------------------------------------- #}

          {% if error <= 1.3 %}
            {% set falling = 0 %}

          {% elif error <= 1.8 %}
            {% set falling = 2 %}

          {% elif error <= 2.3 %}
            {% set falling = 4 %}

          {% elif error <= 2.8 %}
            {% set falling = 6 %}

          {% elif error <= 3.3 %}
            {% set falling = 8 %}

          {% else %}
            {% set falling = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Apply hysteresis.                                  #}
          {# -------------------------------------------------- #}

          {% if rising > previous %}

            {{ rising }}

          {% elif rising < previous %}

            {{ falling }}

          {% else %}

            {{ previous }}

          {% endif %}

        {% endif %}

    # Effective booster speed after applying HVAC minimum-speed rules.
    #
    # The PI target already includes:
    #
    #   proportional base target
    #   +
    #   adaptive correction
    #
    # While HVAC is actively cooling, Speed 1 remains
    # the minimum commanded booster speed.

    - name: "Bed 1 Booster Effective Percentage"
      unique_id: bed_1_booster_effective_percentage
      icon: mdi:fan
      unit_of_measurement: "%"
      state: >
        {% set calculated =
          states('sensor.bed_1_booster_pi_target_speed') | int(0)
        %}
        {% set mode = states('climate.kitchen') %}
        {% set hvac_action =
          state_attr('climate.kitchen', 'hvac_action')
        %}

        {% if mode != 'cool' %}
          0
        {% elif hvac_action == 'cooling' %}
          {{ ([calculated, 1] | max) * 10 }}
        {% else %}
          {{ calculated * 10 }}
        {% endif %}


    - name: "Bed 2 Booster Effective Percentage"
      unique_id: bed_2_booster_effective_percentage
      icon: mdi:fan
      unit_of_measurement: "%"
      state: >
        {% set calculated =
          states('sensor.bed_2_booster_pi_target_speed') | int(0)
        %}
