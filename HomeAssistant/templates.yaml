# ==============================================================
# HVAC BEDROOM BALANCING
#
# Temperature deltas and calculated booster target speeds.
#
# Positive delta:
#   Bedroom is warmer than Kitchen.
#
# Negative delta:
#   Bedroom is cooler than Kitchen.
#
# Booster control curve:
#
#   < 1.5°F   = OFF
#   1.5°F     = Speed 2
#   2.0°F     = Speed 4
#   2.5°F     = Speed 6
#   3.0°F     = Speed 8
#   3.5°F+    = Speed 10
#
# Hysteresis:
#   0.2°F below each threshold before reducing speed.
#
# The calculated target-speed sensors do not include the minimum
# Speed 1 used while the HVAC is actively heating or cooling.
#
# That rule is applied by the automation. The effective-percentage
# sensors below mirror the final speed that the automation intends
# to send to each booster.
# ==============================================================

- sensor:

    # ==========================================================
    # BED 1 TEMPERATURE DELTA
    #
    # Positive = Bed 1 warmer than Kitchen.
    # Negative = Bed 1 cooler than Kitchen.
    # ==========================================================

    - name: "Bed 1 Temperature Delta"
      unique_id: bed_1_temperature_delta
      unit_of_measurement: "°F"
      state: >
        {% set room = states('sensor.bed_1_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}

        {% if room is not none and kitchen is not none %}
          {{ (room - kitchen) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}


    # ==========================================================
    # BED 2 TEMPERATURE DELTA
    #
    # Positive = Bed 2 warmer than Kitchen.
    # Negative = Bed 2 cooler than Kitchen.
    # ==========================================================

    - name: "Bed 2 Temperature Delta"
      unique_id: bed_2_temperature_delta
      unit_of_measurement: "°F"
      state: >
        {% set room = states('sensor.bed_2_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}

        {% if room is not none and kitchen is not none %}
          {{ (room - kitchen) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}

    # ==========================================================
    # BED 3 TEMPERATURE DELTA
    #
    # Positive = Bed 3 warmer than Kitchen.
    # Negative = Bed 3 cooler than Kitchen.
    # ==========================================================

    - name: "Bed 3 Temperature Delta"
      unique_id: bed_3_temperature_delta
      unit_of_measurement: "°F"
      state: >
        {% set room = states('sensor.bed_3_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}

        {% if room is not none and kitchen is not none %}
          {{ (room - kitchen) | round(1) }}
        {% else %}
          {{ none }}
        {% endif %}

    # ==========================================================
    # BED 1 BOOSTER TARGET SPEED
    #
    # Increasing temperature error:
    #
    # < 1.5°F   = OFF
    # 1.5-2.0°F = Speed 2
    # 2.0-2.5°F = Speed 4
    # 2.5-3.0°F = Speed 6
    # 3.0-3.5°F = Speed 8
    # >= 3.5°F  = Speed 10
    #
    # Hysteresis = 0.2°F
    #
    # Example:
    #
    # Speed 4 starts at 2.0°F.
    # Once active, it does not fall back to Speed 2 until
    # the error reaches 1.8°F or less.
    #
    # COOL:
    # Bedroom warmer than Kitchen creates demand.
    #
    # HEAT:
    # Bedroom cooler than Kitchen creates demand.
    #
    # HEAT_COOL:
    # hvac_action determines the active direction.
    # ==========================================================

    - name: "Bed 1 Booster Target Speed"
      unique_id: bed_1_booster_target_speed
      state: >
        {% set room = states('sensor.bed_1_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}
        {% set mode = states('climate.kitchen') %}
        {% set action = state_attr('climate.kitchen', 'hvac_action') %}
        {% set previous = this.state | int(0) %}

        {% if room is none or kitchen is none %}

          {{ none }}

        {% else %}

          {# -------------------------------------------------- #}
          {# Calculate directional temperature error.           #}
          {# -------------------------------------------------- #}

          {% if mode == 'cool' %}
            {% set error = room - kitchen %}

          {% elif mode == 'heat' %}
            {% set error = kitchen - room %}

          {% elif mode == 'heat_cool' and action == 'cooling' %}
            {% set error = room - kitchen %}

          {% elif mode == 'heat_cool' and action == 'heating' %}
            {% set error = kitchen - room %}

          {% else %}
            {% set error = 0 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Increasing-demand thresholds.                     #}
          {# -------------------------------------------------- #}

          {% if error < 1.5 %}
            {% set rising = 0 %}

          {% elif error < 2.0 %}
            {% set rising = 2 %}

          {% elif error < 2.5 %}
            {% set rising = 4 %}

          {% elif error < 3.0 %}
            {% set rising = 6 %}

          {% elif error < 3.5 %}
            {% set rising = 8 %}

          {% else %}
            {% set rising = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Decreasing-demand thresholds.                     #}
          {#                                                   #}
          {# Each threshold is shifted down by 0.2°F to        #}
          {# prevent rapid speed changes around boundaries.    #}
          {# -------------------------------------------------- #}

          {% if error <= 1.3 %}
            {% set falling = 0 %}

          {% elif error <= 1.8 %}
            {% set falling = 2 %}

          {% elif error <= 2.3 %}
            {% set falling = 4 %}

          {% elif error <= 2.8 %}
            {% set falling = 6 %}

          {% elif error <= 3.3 %}
            {% set falling = 8 %}

          {% else %}
            {% set falling = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Apply hysteresis.                                  #}
          {# -------------------------------------------------- #}

          {% if rising > previous %}

            {{ rising }}

          {% elif rising < previous %}

            {{ falling }}

          {% else %}

            {{ previous }}

          {% endif %}

        {% endif %}


    # ==========================================================
    # BED 2 BOOSTER TARGET SPEED
    #
    # Same curve and hysteresis used for Bed 1.
    # ==========================================================

    - name: "Bed 2 Booster Target Speed"
      unique_id: bed_2_booster_target_speed
      state: >
        {% set room = states('sensor.bed_2_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}
        {% set mode = states('climate.kitchen') %}
        {% set action = state_attr('climate.kitchen', 'hvac_action') %}
        {% set previous = this.state | int(0) %}

        {% if room is none or kitchen is none %}

          {{ none }}

        {% else %}

          {# -------------------------------------------------- #}
          {# Calculate directional temperature error.           #}
          {# -------------------------------------------------- #}

          {% if mode == 'cool' %}
            {% set error = room - kitchen %}

          {% elif mode == 'heat' %}
            {% set error = kitchen - room %}

          {% elif mode == 'heat_cool' and action == 'cooling' %}
            {% set error = room - kitchen %}

          {% elif mode == 'heat_cool' and action == 'heating' %}
            {% set error = kitchen - room %}

          {% else %}
            {% set error = 0 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Increasing-demand thresholds.                     #}
          {# -------------------------------------------------- #}

          {% if error < 1.5 %}
            {% set rising = 0 %}

          {% elif error < 2.0 %}
            {% set rising = 2 %}

          {% elif error < 2.5 %}
            {% set rising = 4 %}

          {% elif error < 3.0 %}
            {% set rising = 6 %}

          {% elif error < 3.5 %}
            {% set rising = 8 %}

          {% else %}
            {% set rising = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Decreasing-demand thresholds with 0.2°F hysteresis.#}
          {# -------------------------------------------------- #}

          {% if error <= 1.3 %}
            {% set falling = 0 %}

          {% elif error <= 1.8 %}
            {% set falling = 2 %}

          {% elif error <= 2.3 %}
            {% set falling = 4 %}

          {% elif error <= 2.8 %}
            {% set falling = 6 %}

          {% elif error <= 3.3 %}
            {% set falling = 8 %}

          {% else %}
            {% set falling = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Apply hysteresis.                                  #}
          {# -------------------------------------------------- #}

          {% if rising > previous %}

            {{ rising }}

          {% elif rising < previous %}

            {{ falling }}

          {% else %}

            {{ previous }}

          {% endif %}

        {% endif %}

    # ==========================================================
    # BED 3 BOOSTER TARGET SPEED
    #
    # Same curve and hysteresis used for Bed 1 and Bed 2.
    # ==========================================================

    - name: "Bed 3 Booster Target Speed"
      unique_id: bed_3_booster_target_speed
      state: >
        {% set room = states('sensor.bed_3_temp_temperature') | float(none) %}
        {% set kitchen = states('sensor.kitchen_temp_temperature') | float(none) %}
        {% set mode = states('climate.kitchen') %}
        {% set action = state_attr('climate.kitchen', 'hvac_action') %}
        {% set previous = this.state | int(0) %}

        {% if room is none or kitchen is none %}

          {{ none }}

        {% else %}

          {# -------------------------------------------------- #}
          {# Calculate directional temperature error.           #}
          {# -------------------------------------------------- #}

          {% if mode == 'cool' %}
            {% set error = room - kitchen %}

          {% elif mode == 'heat' %}
            {% set error = kitchen - room %}

          {% elif mode == 'heat_cool' and action == 'cooling' %}
            {% set error = room - kitchen %}

          {% elif mode == 'heat_cool' and action == 'heating' %}
            {% set error = kitchen - room %}

          {% else %}
            {% set error = 0 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Increasing-demand thresholds.                     #}
          {# -------------------------------------------------- #}

          {% if error < 1.5 %}
            {% set rising = 0 %}

          {% elif error < 2.0 %}
            {% set rising = 2 %}

          {% elif error < 2.5 %}
            {% set rising = 4 %}

          {% elif error < 3.0 %}
            {% set rising = 6 %}

          {% elif error < 3.5 %}
            {% set rising = 8 %}

          {% else %}
            {% set rising = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Decreasing-demand thresholds with 0.2°F hysteresis.#}
          {# -------------------------------------------------- #}

          {% if error <= 1.3 %}
            {% set falling = 0 %}

          {% elif error <= 1.8 %}
            {% set falling = 2 %}

          {% elif error <= 2.3 %}
            {% set falling = 4 %}

          {% elif error <= 2.8 %}
            {% set falling = 6 %}

          {% elif error <= 3.3 %}
            {% set falling = 8 %}

          {% else %}
            {% set falling = 10 %}
          {% endif %}


          {# -------------------------------------------------- #}
          {# Apply hysteresis.                                  #}
          {# -------------------------------------------------- #}

          {% if rising > previous %}

            {{ rising }}

          {% elif rising < previous %}

            {{ falling }}

          {% else %}

            {{ previous }}

          {% endif %}

        {% endif %}

    # Effective booster speed after applying HVAC minimum-speed rules.
    #
    # The calculated target sensor may return 0 when the room is already
    # balanced, but while the HVAC is actively heating or cooling the
    # automation forces a minimum booster speed of 1.
    #
    # These sensors represent the final speed that the automation intends
    # to send to each booster.

    - name: "Bed 1 Booster Effective Percentage"
      unique_id: bed_1_booster_effective_percentage
      icon: mdi:fan
      unit_of_measurement: "%"
      state: >
        {% set calculated = states('sensor.bed_1_booster_target_speed') | int(0) %}
        {% set hvac_action = state_attr('climate.kitchen', 'hvac_action') %}

        {% if hvac_action in ['cooling', 'heating'] %}
          {{ ([calculated, 1] | max) * 10 }}
        {% else %}
          {{ calculated * 10 }}
        {% endif %}

    - name: "Bed 2 Booster Effective Percentage"
      unique_id: bed_2_booster_effective_percentage
      icon: mdi:fan
      unit_of_measurement: "%"
      state: >
        {% set calculated = states('sensor.bed_2_booster_target_speed') | int(0) %}
        {% set hvac_action = state_attr('climate.kitchen', 'hvac_action') %}

        {% if hvac_action in ['cooling', 'heating'] %}
          {{ ([calculated, 1] | max) * 10 }}
        {% else %}
          {{ calculated * 10 }}
        {% endif %}

    - name: "Bed 3 Booster Effective Percentage"
      unique_id: bed_3_booster_effective_percentage
      icon: mdi:fan
      unit_of_measurement: "%"
      state: >
        {% set calculated = states('sensor.bed_3_booster_target_speed') | int(0) %}
        {% set hvac_action = state_attr('climate.kitchen', 'hvac_action') %}

        {% if hvac_action in ['cooling', 'heating'] %}
          {{ ([calculated, 1] | max) * 10 }}
        {% else %}
          {{ calculated * 10 }}
        {% endif %}