        %}

        {% if mode != 'cool' %}
          0
        {% elif hvac_action == 'cooling' %}
          {{ ([calculated, 1] | max) * 10 }}
        {% else %}
          {{ calculated * 10 }}
        {% endif %}


    - name: "Bed 3 Booster Effective Percentage"
      unique_id: bed_3_booster_effective_percentage
      icon: mdi:fan
      unit_of_measurement: "%"
      state: >
        {% set calculated =
          states('sensor.bed_3_booster_pi_target_speed') | int(0)
        %}
        {% set mode = states('climate.kitchen') %}
