        {% elif hvac_action == 'cooling' %}
          {{ ([calculated, 1] | max) * 10 }}
        {% else %}
          {{ calculated * 10 }}
        {% endif %}

# ==============================================================
# HVAC ADAPTIVE BOOSTER CONTROL - PI-LITE
#
# ACTIVE THERMAL BALANCING
#
# The existing Booster Target Speed remains the proportional (P)
# controller.
#
# IMPORTANT:
# Adaptive balancing is enabled only while the thermostat MODE is
# COOL. A bedroom warmer than Kitchen creates demand even while
# hvac_action is idle. Heating balancing is intentionally deferred
# until lower-floor boosters are installed.
#
# The controller wakes every 5 minutes and evaluates the adaptive
# correction approximately every 20 minutes.
#
# Response over approximately 20 minutes:
#
#   Improvement < 0.2°F  -> adaptive boost +1
#   Improvement 0.2-0.5  -> hold
#   Improvement >= 0.5°F -> adaptive boost -1
#
# Adaptive reset:
#   - thermostat mode leaves or enters COOL
#   - temperature sensor becomes unavailable
#   - directional error <= 1.3°F
#
# Anti-windup prevents final target from exceeding Speed 10.
#
# HEAT and HEAT_COOL intentionally produce no bedroom booster demand
# in the current hardware configuration.
# ==============================================================

- triggers:

    - trigger: time_pattern
      minutes: "/5"
      id: adaptive_tick

    - trigger: state
      entity_id: climate.kitchen
      to: null
      id: hvac_mode_change

    - trigger: homeassistant
      event: start
      id: startup

  sensor:

    # ==========================================================
    # BED 1 ADAPTIVE BOOST
    # ==========================================================

    - name: "Bed 1 Booster Adaptive Boost"
      unique_id: bed_1_booster_adaptive_boost
      icon: mdi:fan-plus

      state: >
        {% set previous_boost = this.state | int(0) %}
        {% set room =
          states('sensor.bed_1_temp_temperature') | float(none)
        %}
        {% set kitchen =
          states('sensor.kitchen_temp_temperature') | float(none)
        %}
        {% set mode = states('climate.kitchen') %}
        {% set base =
          states('sensor.bed_1_booster_target_speed') | int(0)
        %}
        {% set reference_error =
          this.attributes.get('reference_error') | float(none)
        %}
        {% set last_evaluation =
          this.attributes.get('last_evaluation')
        %}

        {# Current hardware topology supports bedroom balancing
           only while the thermostat is in COOL mode. #}
        {% if mode == 'cool' %}
          {% set direction = 'cooling' %}
        {% else %}
          {% set direction = 'none' %}
        {% endif %}

        {% if room is none or kitchen is none or direction == 'none' %}

          0

        {% else %}

          {% if direction == 'cooling' %}
            {% set error = room - kitchen %}
          {% else %}
            {% set error = kitchen - room %}
          {% endif %}

          {% set headroom = [10 - base, 0] | max %}
          {% set current = [previous_boost, headroom] | min %}
          {% set current = [current, 0] | max %}

          {% if last_evaluation is none %}
            {% set due = false %}
          {% else %}
            {% set elapsed =
              as_timestamp(now())
              -
              as_timestamp(last_evaluation, as_timestamp(now()))
            %}
            {% set due = elapsed >= 1200 %}
          {% endif %}

          {# Changing thermostat mode starts a fresh control cycle. #}
          {% if trigger.id == 'hvac_mode_change' %}

            0

          {# No headroom remains above the proportional command. #}
          {% elif base >= 10 %}

            0

          {# Balanced: remove integral correction immediately. #}
          {% elif error <= 1.3 %}

            0

          {# Evaluate the integral correction only every ~20 min. #}
          {% elif not due %}

            {{ current }}

          {# Near the lower threshold, unwind one step. #}
          {% elif error < 1.5 %}

            {{ [current - 1, 0] | max }}

          {% elif reference_error is none %}

            {{ current }}

          {% else %}

            {% set improvement = reference_error - error %}

            {# Less than 0.2°F improvement in ~20 min: add one step. #}
            {% if improvement < 0.2 %}

              {{ [current + 1, headroom] | min }}

            {# 0.5°F or more improvement: remove one adaptive step. #}
            {% elif improvement >= 0.5 %}

              {{ [current - 1, 0] | max }}

            {# 0.2-0.5°F improvement: hold. #}
            {% else %}

              {{ current }}

            {% endif %}

          {% endif %}

        {% endif %}

      attributes:

        base_speed: >
          {{ states('sensor.bed_1_booster_target_speed') | int(0) }}

        control_direction: >
          {% set mode = states('climate.kitchen') %}
          {% if mode == 'cool' %}
            cooling
          {% else %}
            none
          {% endif %}

        directional_error: >
          {% set room =
            states('sensor.bed_1_temp_temperature') | float(none)
          %}
          {% set kitchen =
            states('sensor.kitchen_temp_temperature') | float(none)
          %}
          {% set mode = states('climate.kitchen') %}
          {% if mode == 'cool' %}
            {% set direction = 'cooling' %}
          {% else %}
            {% set direction = 'none' %}
          {% endif %}

          {% if room is none or kitchen is none or direction == 'none' %}
            {{ none }}
          {% elif direction == 'cooling' %}
            {{ (room - kitchen) | round(2) }}
          {% else %}
            {{ (kitchen - room) | round(2) }}
          {% endif %}

        reference_error: >
          {% set room =
            states('sensor.bed_1_temp_temperature') | float(none)
          %}
          {% set kitchen =
            states('sensor.kitchen_temp_temperature') | float(none)
          %}
          {% set mode = states('climate.kitchen') %}

          {% set old =
            this.attributes.get('reference_error')
          %}
          {% set last =
            this.attributes.get('last_evaluation')
          %}


          {% if mode == 'cool' %}
            {% set direction = 'cooling' %}
          {% else %}
            {% set direction = 'none' %}
          {% endif %}

          {% if room is none or kitchen is none or direction == 'none' %}

            {{ none }}

          {% else %}

            {% if direction == 'cooling' %}
              {% set error = room - kitchen %}
            {% else %}
              {% set error = kitchen - room %}
            {% endif %}

            {# Balanced: clear history so next demand starts fresh. #}
            {% if error <= 1.3 %}

              {{ none }}

            {# Thermostat mode changed: start a fresh 20-minute sample. #}
            {% elif trigger.id == 'hvac_mode_change' %}

              {{ error | round(2) }}

            {% elif last is none %}

              {{ error | round(2) }}

            {% else %}

              {% set elapsed =
                as_timestamp(now())
                -
                as_timestamp(last, as_timestamp(now()))
              %}

              {% if elapsed >= 1200 %}
                {{ error | round(2) }}
              {% else %}
                {{ old }}
              {% endif %}

            {% endif %}

          {% endif %}

        last_evaluation: >
          {% set room =
            states('sensor.bed_1_temp_temperature') | float(none)
          %}
          {% set kitchen =
            states('sensor.kitchen_temp_temperature') | float(none)
          %}
          {% set mode = states('climate.kitchen') %}

          {% set old =
            this.attributes.get('last_evaluation')
          %}


          {% if mode == 'cool' %}
            {% set direction = 'cooling' %}
          {% else %}
            {% set direction = 'none' %}
          {% endif %}

          {% if room is none or kitchen is none or direction == 'none' %}

            {{ none }}

          {% else %}

            {% if direction == 'cooling' %}
              {% set error = room - kitchen %}
            {% else %}
              {% set error = kitchen - room %}
            {% endif %}

            {% if error <= 1.3 %}

              {{ none }}

            {% elif trigger.id == 'hvac_mode_change' %}

              {{ now().isoformat() }}

            {% elif old is none %}

              {{ now().isoformat() }}

            {% else %}

              {% set elapsed =
                as_timestamp(now())
                -
                as_timestamp(old, as_timestamp(now()))
              %}

              {% if elapsed >= 1200 %}
                {{ now().isoformat() }}
              {% else %}
                {{ old }}
              {% endif %}

            {% endif %}

          {% endif %}

    # ==========================================================
    # BED 2 ADAPTIVE BOOST
    # ==========================================================

    - name: "Bed 2 Booster Adaptive Boost"
      unique_id: bed_2_booster_adaptive_boost
      icon: mdi:fan-plus

      state: >
