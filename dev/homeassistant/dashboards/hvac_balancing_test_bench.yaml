title: HVAC Balancing Test Bench

views:

  - title: Test Bench
    path: test-bench
    icon: mdi:hvac

    cards:

      - type: markdown
        title: HVAC Balancing Test Bench
        content: |
          Development-only virtual environment for HVAC Balancing v0.2.0.

          Change temperatures, HVAC state, availability, and virtual actuators
          here without touching production Home Assistant equipment.

      - type: entities
        title: Simulation Controls - Temperatures
        show_header_toggle: false
        entities:

          - entity: input_number.hvac_test_thermostat_temperature
            name: Thermostat Temperature

          - entity: input_number.hvac_test_kitchen_temperature
            name: Kitchen / Reference

          - entity: input_number.hvac_test_bed_1_temperature
            name: Bed 1

          - entity: input_number.hvac_test_bed_2_temperature
            name: Bed 2

          - entity: input_number.hvac_test_bed_3_temperature
            name: Bed 3

      - type: thermostat
        entity: climate.hvac_test_thermostat
        name: Virtual Central HVAC
        show_current_as_primary: true

      - type: entities
        title: Virtual Temperature Sensors
        show_header_toggle: false
        state_color: true
        entities:

          - sensor.hvac_test_thermostat_temperature
          - sensor.hvac_test_kitchen_temperature
          - sensor.hvac_test_bed_1_temperature
          - sensor.hvac_test_bed_2_temperature
          - sensor.hvac_test_bed_3_temperature

      - type: entities
        title: Temperature Sensor Fault Injection
        show_header_toggle: false
        state_color: true
        entities:

          - entity: input_boolean.hvac_test_thermostat_sensor_available
            name: Thermostat Sensor Available

          - entity: input_boolean.hvac_test_kitchen_sensor_available
            name: Kitchen Sensor Available

          - entity: input_boolean.hvac_test_bed_1_sensor_available
            name: Bed 1 Sensor Available

          - entity: input_boolean.hvac_test_bed_2_sensor_available
            name: Bed 2 Sensor Available

          - entity: input_boolean.hvac_test_bed_3_sensor_available
            name: Bed 3 Sensor Available

      - type: entities
        title: Virtual Central HVAC
        show_header_toggle: false
        state_color: true
        entities:

          - entity: switch.hvac_test_ac_compressor
            name: AC Compressor

          - entity: input_boolean.hvac_test_ac_compressor_available
            name: Compressor Available

          - entity: fan.hvac_test_central_blower
            name: Central Blower

          - entity: input_boolean.hvac_test_central_blower_available
            name: Central Blower Available

      - type: entities
        title: Virtual Booster Fans
        show_header_toggle: false
        state_color: true
        entities:

          - entity: fan.hvac_test_bed_1_booster
            name: Bed 1 Booster

          - entity: fan.hvac_test_bed_2_booster
            name: Bed 2 Booster

          - entity: fan.hvac_test_bed_3_booster
            name: Bed 3 Booster

      - type: entities
        title: Booster Fault Injection
        show_header_toggle: false
        state_color: true
        entities:

          - entity: input_boolean.hvac_test_bed_1_booster_available
            name: Bed 1 Booster Available

          - entity: input_boolean.hvac_test_bed_2_booster_available
            name: Bed 2 Booster Available

          - entity: input_boolean.hvac_test_bed_3_booster_available
            name: Bed 3 Booster Available

      - type: entities
        title: Preset Test Scenarios
        show_header_toggle: false
        entities:

          - script.hvac_test_scenario_balanced

          - script.hvac_test_scenario_mild_bed_2

          - script.hvac_test_scenario_severe_upstairs

          - script.hvac_test_scenario_adaptive_i

          - script.hvac_test_scenario_bed_2_sensor_failure

          - script.hvac_test_restore_availability

          - script.hvac_test_reset_virtual_boosters

      - type: markdown
        title: Controller Diagnostics
        content: |
          **Phase 1.5:** Virtual environment only.

          The v0.2 Python controller is not connected yet.

          During Phase 2 this section will receive:

          - Temperature Delta
          - Base P
          - Adaptive I
          - PI Target
          - Effective Percentage
          - Controller Status
          - Central Blower Assist Decision

      - type: markdown
        title: Manual Validation Ideas
        content: |
          **Compressor cycle**

          Keep HVAC mode on `cool`, then move Thermostat Temperature above
          and below the thermostat target.

          Kitchen / Reference remains independent and is used by the balancing
          controller rather than by the virtual thermostat.

          Expected climate action sequence:

          `cooling -> idle -> cooling`

          **Hysteresis**

          Hold Kitchen at 75°F and move one bedroom through:

          `76.4 -> 76.5 -> 76.6 -> 76.4 -> 76.3`

          **Sensor failure**

          Turn a Sensor Available control OFF. Its corresponding
          `sensor.hvac_test_*` entity should become unavailable.

          **Booster failure**

          Turn a Booster Available control OFF. Its corresponding
          virtual `fan` entity should become unavailable.
