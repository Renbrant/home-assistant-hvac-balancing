        data:
          value: "Bed 2 Base P = 0. Falling threshold reached at 1.3F."

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_bed_2_temperature
        data:
          value: 76.3

  # --------------------------------------------------------------------------
  # Guided Adaptive I / issue #3 sequence
  #
  # Scenario 1 starts a fresh 20-minute observation window.
  # Scenarios 2 and 3 change compressor action only while HVAC mode stays cool.
  # The Bed 2 Adaptive countdown must NOT restart.
  # --------------------------------------------------------------------------

  hvac_test_validation_adaptive_1_start:
    alias: "Validation Adaptive 1/3 - Fresh Persistent Error"
    mode: restart
    sequence:

      - action: script.hvac_test_validation_prepare

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_thermostat_temperature
        data:
          value: 76.5

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_bed_1_temperature
        data:
          value: 75

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_bed_2_temperature
        data:
          value: 78

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_bed_3_temperature
        data:
          value: 75

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_active_validation_scenario
        data:
          value: "Adaptive 1/3 - Fresh persistent Bed 2 error"

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "Bed2 Base=8 I=0 PI=8. Cooling exposure starts at 00:00 / 10:00 while HVAC is Cooling."

      - action: climate.set_hvac_mode
        target:
          entity_id: climate.hvac_test_thermostat
        data:
          hvac_mode: cool

  hvac_test_validation_adaptive_2_idle:
    alias: "Validation Adaptive 2/3 - Cooling to Idle"
    mode: restart
    sequence:

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_active_validation_scenario
        data:
          value: "Adaptive 2/3 - Cooling to Idle"

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "HVAC becomes Idle. Bed2 cooling exposure MUST PAUSE and keep the same accumulated time."

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_thermostat_temperature
        data:
          value: 74

  hvac_test_validation_adaptive_3_cooling:
    alias: "Validation Adaptive 3/3 - Idle to Cooling"
    mode: restart
    sequence:

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_active_validation_scenario
        data:
          value: "Adaptive 3/3 - Idle to Cooling"

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "HVAC returns Cooling. Bed2 exposure resumes. At 10:00 total cooling, next tick should raise I to 1."

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_thermostat_temperature
        data:
          value: 76.5

  # --------------------------------------------------------------------------
  # Guided fault validation
  # --------------------------------------------------------------------------

  hvac_test_validation_sensor_failure:
    alias: "Validation Fault - Bed 2 Sensor Failure"
    mode: restart
    sequence:

      - action: script.hvac_test_scenario_bed_2_sensor_failure

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_active_validation_scenario
        data:
          value: "Fault - Bed 2 Sensor Unavailable"

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "Bed2 temperature unavailable; Base=0 PI=0 Effective=0%. Other zones continue."

  hvac_test_validation_sensor_recovery:
    alias: "Validation Fault - Restore Bed 2 Sensor"
    mode: restart
    sequence:

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.hvac_test_bed_2_sensor_available

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_active_validation_scenario
        data:
          value: "Fault Recovery - Bed 2 Sensor Restored"

      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "Bed2 temperature returns and controller resumes normal calculation."
