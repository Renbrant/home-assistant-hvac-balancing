      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "Bed 2 Base P remains 2."

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_bed_2_temperature
        data:
          value: 76.6

  hvac_test_validation_hysteresis_4_hold:
    alias: "Validation Hysteresis 4/5 - Hold at 76.4"
