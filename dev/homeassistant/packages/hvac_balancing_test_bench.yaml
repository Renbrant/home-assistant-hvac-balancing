      - action: input_text.set_value
        target:
          entity_id: input_text.hvac_test_expected_validation_result
        data:
          value: "Bed 2 Base P must HOLD at 2. This proves hysteresis."

      - action: input_number.set_value
        target:
          entity_id: input_number.hvac_test_bed_2_temperature
